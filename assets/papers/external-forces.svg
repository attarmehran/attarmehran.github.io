<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Separating body coupling from external contact</title><desc id="desc">Joint position and velocity signals support two connected observers. The first estimates body-leg coupling torques. The second uses that estimate to recover external torques, which a Jacobian maps to foot forces.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#46637d"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;fill:#142a40}.small{font-size:16px;fill:#596977}.tiny{font-size:14px;fill:#596977}.label{font-size:15px;letter-spacing:1px;fill:#596977}.box{fill:#fff;stroke:#ccd8e2;stroke-width:1.5}.box.blue{fill:#eaf0ff;stroke:#a4bbf3}.box.green{fill:#eaf5f0;stroke:#a6cdbb}.box.gold{fill:#fcf3e6;stroke:#e4c390}.box.dark{fill:#112941;stroke:#112941}.box-text{font-weight:600}.box-text.dark{fill:#fff}.arrow{fill:none;stroke:#46637d;stroke-width:2;stroke-linejoin:round}.dashed{stroke-dasharray:6 6}.accent{fill:#245bdd}.green-text{fill:#246b53}</style>
<rect width="640" height="390" fill="#f3f6f9"/><text x="32" y="35" text-anchor="start" class="label"><tspan x="32" dy="0">SEPARATE COUPLING FROM CONTACT</tspan></text><rect x="33" y="70" width="235" height="78" rx="12" class="box "/><text x="150.5" y="103.5" text-anchor="middle" class="box-text "><tspan x="150.5" dy="0">Joint position</tspan><tspan x="150.5" dy="25">+ velocity</tspan></text><path d="M280 108 H333" class="arrow " marker-end="url(#arrow)"/><rect x="351" y="70" width="255" height="78" rx="12" class="box blue"/><text x="478.5" y="103.5" text-anchor="middle" class="box-text blue"><tspan x="478.5" dy="0">Observer 1</tspan><tspan x="478.5" dy="25">body–leg coupling</tspan></text><path d="M478 162 V238" class="arrow " marker-end="url(#arrow)"/><text x="463" y="204" text-anchor="end" class="small"><tspan x="463" dy="0">Coupling estimate</tspan></text><rect x="351" y="253" width="255" height="85" rx="12" class="box blue"/><text x="478.5" y="290.0" text-anchor="middle" class="box-text blue"><tspan x="478.5" dy="0">Observer 2</tspan><tspan x="478.5" dy="25">external torque</tspan></text><path d="M338 295 H280" class="arrow " marker-end="url(#arrow)"/><rect x="33" y="253" width="235" height="85" rx="12" class="box green"/><text x="150.5" y="290.0" text-anchor="middle" class="box-text green"><tspan x="150.5" dy="0">Jacobian mapping</tspan><tspan x="150.5" dy="25">foot force estimate</tspan></text><text x="320" y="378" text-anchor="middle" class="small"><tspan x="320" dy="0">Contact force is inferred without a dedicated force sensor.</tspan></text></svg>