<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Working backward from a safe target</title><desc id="desc">Conceptual nested controllable regions built backward from a robust invariant target. A control action carries the state to the preceding region despite bounded disturbances. Shapes are illustrative.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#46637d"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;fill:#142a40}.small{font-size:16px;fill:#596977}.tiny{font-size:14px;fill:#596977}.label{font-size:15px;letter-spacing:1px;fill:#596977}.box{fill:#fff;stroke:#ccd8e2;stroke-width:1.5}.box.blue{fill:#eaf0ff;stroke:#a4bbf3}.box.green{fill:#eaf5f0;stroke:#a6cdbb}.box.gold{fill:#fcf3e6;stroke:#e4c390}.box.dark{fill:#112941;stroke:#112941}.box-text{font-weight:600}.box-text.dark{fill:#fff}.arrow{fill:none;stroke:#46637d;stroke-width:2;stroke-linejoin:round}.dashed{stroke-dasharray:6 6}.accent{fill:#245bdd}.green-text{fill:#246b53}</style>
<rect width="640" height="390" fill="#f3f6f9"/><text x="32" y="35" text-anchor="start" class="label"><tspan x="32" dy="0">PLAN BACKWARD. CONTROL FORWARD.</tspan></text><path d="M40 160 133 64 476 64 603 200 555 321 170 349 40 265Z" fill="#e8edf4" stroke="#b6c4d5" stroke-width="2"/><path d="M133 179 210 117 470 120 542 205 487 295 236 302 133 258Z" fill="#dce6fd" stroke="#8ca8e6" stroke-width="2"/><path d="M254 185 310 159 457 160 485 221 448 271 313 270 254 235Z" fill="#bfd1f6" stroke="#527cca" stroke-width="2"/><path d="M361 201 430 192 456 225 421 249 365 240 351 222Z" fill="#112941"/><text x="168" y="96" text-anchor="middle" class="small"><tspan x="168" dy="0">T₃</tspan></text><text x="260" y="147" text-anchor="middle" class="small"><tspan x="260" dy="0">T₂</tspan></text><text x="328" y="190" text-anchor="middle" class="small"><tspan x="328" dy="0">T₁</tspan></text><text x="405" y="227" text-anchor="middle" fill="white" style="fill:white;font-size:18px">Target</text><path d="M80 221 H180" class="arrow " marker-end="url(#arrow)"/><path d="M195 221 H284" class="arrow " marker-end="url(#arrow)"/><path d="M294 221 H340" class="arrow " marker-end="url(#arrow)"/><text x="320" y="380" text-anchor="middle" class="small"><tspan x="320" dy="0">One step closer, for every admissible disturbance.</tspan></text></svg>