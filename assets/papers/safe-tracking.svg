<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Three levels of response to a network attack</title><desc id="desc">Trusted measurements allow normal tracking. Unreliable measurements can trigger supervised open-loop tracking while safety can be certified. Unsafe commands trigger local emergency control.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#46637d"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;fill:#142a40}.small{font-size:16px;fill:#596977}.tiny{font-size:14px;fill:#596977}.label{font-size:15px;letter-spacing:1px;fill:#596977}.box{fill:#fff;stroke:#ccd8e2;stroke-width:1.5}.box.blue{fill:#eaf0ff;stroke:#a4bbf3}.box.green{fill:#eaf5f0;stroke:#a6cdbb}.box.gold{fill:#fcf3e6;stroke:#e4c390}.box.dark{fill:#112941;stroke:#112941}.box-text{font-weight:600}.box-text.dark{fill:#fff}.arrow{fill:none;stroke:#46637d;stroke-width:2;stroke-linejoin:round}.dashed{stroke-dasharray:6 6}.accent{fill:#245bdd}.green-text{fill:#246b53}</style>
<rect width="640" height="390" fill="#f3f6f9"/><text x="32" y="35" text-anchor="start" class="label"><tspan x="32" dy="0">KEEP THE SYSTEM SAFE. TRACK WHEN FEASIBLE.</tspan></text><rect x="32" y="62" width="240" height="72" rx="12" class="box "/><text x="152.0" y="92.5" text-anchor="middle" class="box-text "><tspan x="152.0" dy="0">Trusted</tspan><tspan x="152.0" dy="25">measurements</tspan></text><path d="M284 98 H336" class="arrow " marker-end="url(#arrow)"/><rect x="352" y="62" width="256" height="72" rx="12" class="box blue"/><text x="480.0" y="105.0" text-anchor="middle" class="box-text blue"><tspan x="480.0" dy="0">Normal tracking</tspan></text><rect x="32" y="160" width="240" height="72" rx="12" class="box "/><text x="152.0" y="190.5" text-anchor="middle" class="box-text "><tspan x="152.0" dy="0">Unreliable</tspan><tspan x="152.0" dy="25">measurements</tspan></text><path d="M284 196 H336" class="arrow " marker-end="url(#arrow)"/><rect x="352" y="160" width="256" height="72" rx="12" class="box blue"/><text x="480.0" y="190.5" text-anchor="middle" class="box-text blue"><tspan x="480.0" dy="0">Supervised</tspan><tspan x="480.0" dy="25">open-loop tracking</tspan></text><rect x="32" y="258" width="240" height="72" rx="12" class="box "/><text x="152.0" y="288.5" text-anchor="middle" class="box-text "><tspan x="152.0" dy="0">Command fails</tspan><tspan x="152.0" dy="25">the safety check</tspan></text><path d="M284 294 H336" class="arrow " marker-end="url(#arrow)"/><rect x="352" y="258" width="256" height="72" rx="12" class="box green"/><text x="480.0" y="288.5" text-anchor="middle" class="box-text green"><tspan x="480.0" dy="0">Local emergency</tspan><tspan x="480.0" dy="25">control</tspan></text><text x="320" y="365" text-anchor="middle" class="small"><tspan x="320" dy="0">Tracking continues only while the safety conditions hold.</tspan></text></svg>