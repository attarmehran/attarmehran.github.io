<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Sensor fusion supports robot body correction</title><desc id="desc">Gyroscope, accelerometer, and magnetometer signals feed a switching extended Kalman filter. A switching rule changes the measurement model during acceleration. Estimated attitude drives support-leg corrections.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#46637d"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;fill:#142a40}.small{font-size:16px;fill:#596977}.tiny{font-size:14px;fill:#596977}.label{font-size:15px;letter-spacing:1px;fill:#596977}.box{fill:#fff;stroke:#ccd8e2;stroke-width:1.5}.box.blue{fill:#eaf0ff;stroke:#a4bbf3}.box.green{fill:#eaf5f0;stroke:#a6cdbb}.box.gold{fill:#fcf3e6;stroke:#e4c390}.box.dark{fill:#112941;stroke:#112941}.box-text{font-weight:600}.box-text.dark{fill:#fff}.arrow{fill:none;stroke:#46637d;stroke-width:2;stroke-linejoin:round}.dashed{stroke-dasharray:6 6}.accent{fill:#245bdd}.green-text{fill:#246b53}</style>
<rect width="640" height="390" fill="#f3f6f9"/><text x="32" y="35" text-anchor="start" class="label"><tspan x="32" dy="0">SENSE THE TILT. ADJUST THE SUPPORT LEGS.</tspan></text><rect x="31" y="65" width="180" height="59" rx="12" class="box "/><text x="121.0" y="101.5" text-anchor="middle" class="box-text "><tspan x="121.0" dy="0">Gyroscope</tspan></text><rect x="31" y="145" width="180" height="59" rx="12" class="box "/><text x="121.0" y="181.5" text-anchor="middle" class="box-text "><tspan x="121.0" dy="0">Accelerometer</tspan></text><rect x="31" y="225" width="180" height="59" rx="12" class="box "/><text x="121.0" y="261.5" text-anchor="middle" class="box-text "><tspan x="121.0" dy="0">Magnetometer</tspan></text><path d="M223 95 H250 V173 H294" class="arrow " marker-end="url(#arrow)"/><path d="M223 175 H294" class="arrow " marker-end="url(#arrow)"/><path d="M223 255 H250 V177 H294" class="arrow " marker-end="url(#arrow)"/><rect x="311" y="133" width="298" height="84" rx="12" class="box blue"/><text x="460.0" y="169.5" text-anchor="middle" class="box-text blue"><tspan x="460.0" dy="0">Switching EKF</tspan><tspan x="460.0" dy="25">attitude + gyro bias</tspan></text><path d="M460 230 V291" class="arrow " marker-end="url(#arrow)"/><rect x="311" y="305" width="298" height="57" rx="12" class="box green"/><text x="460.0" y="340.5" text-anchor="middle" class="box-text green"><tspan x="460.0" dy="0">Support-leg correction</tspan></text><text x="111" y="332" text-anchor="middle" class="tiny"><tspan x="111" dy="0">Switch the measurement</tspan></text><text x="111" y="353" text-anchor="middle" class="tiny"><tspan x="111" dy="0">model during acceleration.</tspan></text></svg>