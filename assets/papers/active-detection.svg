<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Changing the transmitted measurement representation</title><desc id="desc">Sensor measurements are encoded using a changing subset of principal components. The receiver reconstructs measurements, estimates unknown inputs, and tests for anomalies.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#46637d"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;fill:#142a40}.small{font-size:16px;fill:#596977}.tiny{font-size:14px;fill:#596977}.label{font-size:15px;letter-spacing:1px;fill:#596977}.box{fill:#fff;stroke:#ccd8e2;stroke-width:1.5}.box.blue{fill:#eaf0ff;stroke:#a4bbf3}.box.green{fill:#eaf5f0;stroke:#a6cdbb}.box.gold{fill:#fcf3e6;stroke:#e4c390}.box.dark{fill:#112941;stroke:#112941}.box-text{font-weight:600}.box-text.dark{fill:#fff}.arrow{fill:none;stroke:#46637d;stroke-width:2;stroke-linejoin:round}.dashed{stroke-dasharray:6 6}.accent{fill:#245bdd}.green-text{fill:#246b53}</style>
<rect width="640" height="390" fill="#f3f6f9"/><text x="32" y="35" text-anchor="start" class="label"><tspan x="32" dy="0">MAKE STEALTH HARDER BY CHANGING THE VIEW</tspan></text><rect x="32" y="66" width="235" height="75" rx="12" class="box "/><text x="149.5" y="98.0" text-anchor="middle" class="box-text "><tspan x="149.5" dy="0">Sensor</tspan><tspan x="149.5" dy="25">measurements</tspan></text><path d="M280 104 H339" class="arrow " marker-end="url(#arrow)"/><rect x="355" y="66" width="253" height="75" rx="12" class="box blue"/><text x="481.5" y="98.0" text-anchor="middle" class="box-text blue"><tspan x="481.5" dy="0">Changing PCA</tspan><tspan x="481.5" dy="25">encoding</tspan></text><path d="M481 154 V239" class="arrow " marker-end="url(#arrow)"/><text x="467" y="197" text-anchor="end" class="small"><tspan x="467" dy="0">Network</tspan></text><rect x="355" y="253" width="253" height="83" rx="12" class="box blue"/><text x="481.5" y="276.5" text-anchor="middle" class="box-text blue"><tspan x="481.5" dy="0">Reconstruction</tspan><tspan x="481.5" dy="25">+ unknown-input</tspan><tspan x="481.5" dy="25">observer</tspan></text><path d="M342 294 H280" class="arrow " marker-end="url(#arrow)"/><rect x="32" y="253" width="235" height="83" rx="12" class="box dark"/><text x="149.5" y="289.0" text-anchor="middle" class="box-text dark"><tspan x="149.5" dy="0">Gaussian</tspan><tspan x="149.5" dy="25">anomaly detector</tspan></text><text x="320" y="378" text-anchor="middle" class="small"><tspan x="320" dy="0">The detector accounts for reconstruction uncertainty.</tspan></text></svg>