<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">A plant-side safety gate with a local fallback</title><desc id="desc">A network command enters a plant-side safety check. Verified commands can reach the plant. Unsafe commands are replaced by a local emergency controller.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#46637d"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;fill:#142a40}.small{font-size:16px;fill:#596977}.tiny{font-size:14px;fill:#596977}.label{font-size:15px;letter-spacing:1px;fill:#596977}.box{fill:#fff;stroke:#ccd8e2;stroke-width:1.5}.box.blue{fill:#eaf0ff;stroke:#a4bbf3}.box.green{fill:#eaf5f0;stroke:#a6cdbb}.box.gold{fill:#fcf3e6;stroke:#e4c390}.box.dark{fill:#112941;stroke:#112941}.box-text{font-weight:600}.box-text.dark{fill:#fff}.arrow{fill:none;stroke:#46637d;stroke-width:2;stroke-linejoin:round}.dashed{stroke-dasharray:6 6}.accent{fill:#245bdd}.green-text{fill:#246b53}</style>
<rect width="640" height="390" fill="#f3f6f9"/><text x="32" y="35" text-anchor="start" class="label"><tspan x="32" dy="0">A SAFETY DECISION CLOSE TO THE PLANT</tspan></text><rect x="32" y="65" width="222" height="80" rx="12" class="box "/><text x="143.0" y="99.5" text-anchor="middle" class="box-text "><tspan x="143.0" dy="0">Network</tspan><tspan x="143.0" dy="25">command</tspan></text><path d="M267 105 H337" class="arrow " marker-end="url(#arrow)"/><rect x="354" y="65" width="254" height="80" rx="12" class="box blue"/><text x="481.0" y="99.5" text-anchor="middle" class="box-text blue"><tspan x="481.0" dy="0">Plant-side</tspan><tspan x="481.0" dy="25">safety check</tspan></text><path d="M481 158 V252" class="arrow " marker-end="url(#arrow)"/><text x="503" y="208" text-anchor="start" class="small"><tspan x="503" dy="0">Safe</tspan></text><path d="M369 157 L234 252" class="arrow " marker-end="url(#arrow)"/><text x="220" y="196" text-anchor="middle" class="small"><tspan x="220" dy="0">Unsafe</tspan></text><rect x="32" y="266" width="222" height="80" rx="12" class="box green"/><text x="143.0" y="300.5" text-anchor="middle" class="box-text green"><tspan x="143.0" dy="0">Local emergency</tspan><tspan x="143.0" dy="25">controller</tspan></text><path d="M268 306 H337" class="arrow " marker-end="url(#arrow)"/><rect x="354" y="266" width="254" height="80" rx="12" class="box dark"/><text x="481.0" y="313.0" text-anchor="middle" class="box-text dark"><tspan x="481.0" dy="0">Physical plant</tspan></text><text x="320" y="378" text-anchor="middle" class="small"><tspan x="320" dy="0">Local measurements support the fallback decision.</tspan></text></svg>