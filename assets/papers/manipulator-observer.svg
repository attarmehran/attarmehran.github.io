<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Decentralized estimation for a coupled two-joint robot</title><desc id="desc">Each joint has a time-varying observer. Joint coupling and unknown dynamics enter the disturbance estimate, so decentralization does not assume that the joints are physically independent.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#46637d"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;fill:#142a40}.small{font-size:16px;fill:#596977}.tiny{font-size:14px;fill:#596977}.label{font-size:15px;letter-spacing:1px;fill:#596977}.box{fill:#fff;stroke:#ccd8e2;stroke-width:1.5}.box.blue{fill:#eaf0ff;stroke:#a4bbf3}.box.green{fill:#eaf5f0;stroke:#a6cdbb}.box.gold{fill:#fcf3e6;stroke:#e4c390}.box.dark{fill:#112941;stroke:#112941}.box-text{font-weight:600}.box-text.dark{fill:#fff}.arrow{fill:none;stroke:#46637d;stroke-width:2;stroke-linejoin:round}.dashed{stroke-dasharray:6 6}.accent{fill:#245bdd}.green-text{fill:#246b53}</style>
<rect width="640" height="390" fill="#f3f6f9"/><text x="32" y="35" text-anchor="start" class="label"><tspan x="32" dy="0">LOCAL ESTIMATES FOR A COUPLED ROBOT</tspan></text><rect x="34" y="71" width="207" height="80" rx="12" class="box "/><text x="137.5" y="105.5" text-anchor="middle" class="box-text "><tspan x="137.5" dy="0">Joint 1</tspan><tspan x="137.5" dy="25">signals</tspan></text><path d="M255 112 H328" class="arrow " marker-end="url(#arrow)"/><rect x="345" y="71" width="260" height="80" rx="12" class="box blue"/><text x="475.0" y="118.0" text-anchor="middle" class="box-text blue"><tspan x="475.0" dy="0">Observer 1</tspan></text><rect x="34" y="225" width="207" height="80" rx="12" class="box "/><text x="137.5" y="259.5" text-anchor="middle" class="box-text "><tspan x="137.5" dy="0">Joint 2</tspan><tspan x="137.5" dy="25">signals</tspan></text><path d="M255 267 H328" class="arrow " marker-end="url(#arrow)"/><rect x="345" y="225" width="260" height="80" rx="12" class="box blue"/><text x="475.0" y="272.0" text-anchor="middle" class="box-text blue"><tspan x="475.0" dy="0">Observer 2</tspan></text><path d="M138 164 V211" class="arrow dashed" marker-end="url(#arrow)"/><text x="155" y="193" text-anchor="start" class="small"><tspan x="155" dy="0">Physical coupling</tspan></text><text x="474" y="178" text-anchor="middle" class="small"><tspan x="474" dy="0">State + disturbance</tspan></text><text x="474" y="332" text-anchor="middle" class="small"><tspan x="474" dy="0">State + disturbance</tspan></text><text x="320" y="380" text-anchor="middle" class="small"><tspan x="320" dy="0">Time-varying gains reduce the initial error peak.</tspan></text></svg>