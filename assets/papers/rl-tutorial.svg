<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">The reinforcement learning feedback loop</title><desc id="desc">An agent chooses an action. The environment returns a reward and next state. A Q-value update informs the agent’s next choice. The tutorial moves from tabular to feature-based approximation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#46637d"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;fill:#142a40}.small{font-size:16px;fill:#596977}.tiny{font-size:14px;fill:#596977}.label{font-size:15px;letter-spacing:1px;fill:#596977}.box{fill:#fff;stroke:#ccd8e2;stroke-width:1.5}.box.blue{fill:#eaf0ff;stroke:#a4bbf3}.box.green{fill:#eaf5f0;stroke:#a6cdbb}.box.gold{fill:#fcf3e6;stroke:#e4c390}.box.dark{fill:#112941;stroke:#112941}.box-text{font-weight:600}.box-text.dark{fill:#fff}.arrow{fill:none;stroke:#46637d;stroke-width:2;stroke-linejoin:round}.dashed{stroke-dasharray:6 6}.accent{fill:#245bdd}.green-text{fill:#246b53}</style>
<rect width="640" height="390" fill="#f3f6f9"/><text x="32" y="35" text-anchor="start" class="label"><tspan x="32" dy="0">LEARN A VALUE FROM EXPERIENCE</tspan></text><rect x="39" y="123" width="218" height="95" rx="12" class="box blue"/><text x="148.0" y="165.0" text-anchor="middle" class="box-text blue"><tspan x="148.0" dy="0">Agent</tspan><tspan x="148.0" dy="25">choose an action</tspan></text><rect x="383" y="123" width="218" height="95" rx="12" class="box green"/><text x="492.0" y="177.5" text-anchor="middle" class="box-text green"><tspan x="492.0" dy="0">Environment</tspan></text><path d="M155 110 V73 H492 V110" class="arrow " marker-end="url(#arrow)"/><text x="324" y="60" text-anchor="middle" class="small"><tspan x="324" dy="0">Action</tspan></text><path d="M492 232 V283 H155 V232" class="arrow " marker-end="url(#arrow)"/><text x="325" y="312" text-anchor="middle" class="small"><tspan x="325" dy="0">Reward + next state</tspan></text><rect x="118" y="335" width="405" height="43" rx="12" class="box gold"/><text x="320.5" y="363.5" text-anchor="middle" class="box-text gold"><tspan x="320.5" dy="0">Update Q → choose again</tspan></text></svg>